services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-clinica}
      MARIADB_USER: ${DB_USER:-clinica}
      MARIADB_PASSWORD: ${DB_PASSWORD:-clinica}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-clinica-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - clinica_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  clinica_mariadb:
