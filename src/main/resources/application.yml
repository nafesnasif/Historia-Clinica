spring:
  application:
    name: historia-clinica
  profiles:
    default: memoria          # respaldo; SeleccionDeAlmacenamiento detecta MariaDB antes de cargar los perfiles
  jpa:
    open-in-view: false
---
spring:
  config:
    activate:
      on-profile: memoria
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: mariadb
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clinica}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:clinica}
    password: ${DB_PASSWORD:clinica}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
    defer-datasource-initialization: true   # data.sql corre después de crear las tablas
  sql:
    init:
      mode: always
